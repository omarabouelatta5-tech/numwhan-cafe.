.bg-top{position:absolute;inset:0 0 auto 0;height:min(900px,100vh);background:var(--photo) center bottom/cover no-repeat;z-index:0}
.bg-top::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,10,5,.15) 0%,rgba(18,10,5,0) 40%,rgba(18,10,5,.75) 85%,var(--bg) 100%)}
.bg-bottom{position:absolute;left:0;right:0;bottom:0;height:700px;background:var(--photo) center bottom/cover no-repeat;transform:scaleY(-1);opacity:.4;z-index:0}
.bg-bottom::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,10,5,0) 30%,var(--bg) 100%)}
.page{position:relative;min-height:100vh;overflow:hidden}
.page>*{position:relative;z-index:1}
.page>.bg-top,.page>.bg-bottom{position:absolute;z-index:0}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center}
.brand b{display:block;font-family:Mitr,sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;color:var(--text);line-height:1.05}
.brand small{display:block;font-family:Mitr,sans-serif;font-size:12px;letter-spacing:.2em;color:var(--gold)}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(246,234,219,.1);border:1px solid rgba(246,234,219,.16)}
.lang button{height:38px;min-width:48px;border:0;border-radius:999px;background:transparent;color:#E9D9C4;font-size:14px;font-weight:500;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:600}

/* hero */
.hero{min-height:min(760px,92vh);display:flex;flex-direction:column;padding-top:28px}
.eyebrow{margin:0 0 12px;font-size:13px;letter-spacing:.2em;color:var(--gold2);font-weight:600}
.hero h1{margin:0;font-size:clamp(36px,7vw,64px);line-height:1.1;max-width:13ch}
.hero p.sub{margin:12px 0 0;font-size:17px;color:#E9D9C4;max-width:36ch}
.hero-cta{display:flex;gap:14px;align-items:center;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:18px;border:0;background:var(--gold);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--gold2)}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.perks{font-size:13px;color:#E9D9C4;line-height:1.4}

/* menu */
.menu-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px}
.menu-head h2{margin:0;font-size:30px}
.menu-head span{font-size:14px;color:#D9C3A6}
.cats{display:flex;gap:8px;padding:14px 0 8px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:none;height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;border:1.5px solid rgba(246,234,219,.24);background:rgba(36,23,14,.7);color:var(--text)}
.cats button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;padding:12px 0 150px}
.item{display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.thumb{width:84px;height:84px;flex:none;border-radius:18px;background:rgba(246,234,219,.07);border:1px solid rgba(246,234,219,.08);display:grid;place-items:center}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.info h3{margin:0;font-size:17px}
.info .th{font-size:14px;color:var(--gold2);font-weight:500}
.info .desc{font-size:13px;line-height:1.4;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font-family:Mitr,sans-serif;font-size:17px;font-weight:600;color:var(--head)}
.add{width:44px;height:44px;border:0;border-radius:50%;background:var(--gold);display:grid;place-items:center;cursor:pointer}
.stepper{display:flex;align-items:center;gap:4px;padding:2px;border-radius:999px;background:rgba(246,234,219,.1)}
.stepper button{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:rgba(246,234,219,.14)}
.stepper button.plus{background:var(--gold)}
.stepper span{min-width:22px;text-align:center;font-family:Mitr,sans-serif;font-weight:600;color:var(--head)}
footer{padding:8px 0 130px;text-align:center;font-size:13px;color:var(--muted)}

/* cart bar */
.bar{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto;padding:10px 10px 10px 20px;border-radius:24px;background:rgba(22,13,7,.95);border:1px solid rgba(217,163,92,.35);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.bar small{display:block;font-size:13px;color:#D9C3A6}
.bar strong{display:block;font-family:Mitr,sans-serif;font-size:18px;font-weight:500;color:var(--head)}

/* order sheet */
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:560px;width:100%;max-height:100%;margin:auto auto 0}
dialog::backdrop{background:rgba(8,4,2,.7)}
@media(min-width:700px){dialog{margin:auto}}
.sheet{position:relative;overflow:auto;max-height:92vh;border-radius:28px 28px 0 0;background:#160D07;border:1px solid var(--line);padding:20px 16px 28px}
@media(min-width:700px){.sheet{border-radius:28px}}
.sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:320px;background:var(--photo) center bottom/cover;opacity:.35;z-index:0;pointer-events:none;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.sheet>*{position:relative;z-index:1}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{margin:0;font-size:24px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(246,234,219,.1);border:1px solid rgba(246,234,219,.2);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.summary{margin-top:14px;padding:6px 18px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed rgba(246,234,219,.2)}
.line b{font-weight:600}
.line em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.total{display:flex;justify-content:space-between;padding:14px 0 12px;font-family:Mitr,sans-serif;font-size:18px}
.total span:last-child{font-size:22px;font-weight:600;color:var(--gold2)}
.empty{padding:18px 0;color:var(--muted);text-align:center}
form{display:flex;flex-direction:column;gap:20px;margin-top:22px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,legend{font-weight:600;font-size:15px;color:var(--text);padding:0}
fieldset{border:0;margin:0;padding:0}
legend{margin-bottom:10px}
.input{height:52px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line2);background:var(--card);font-size:16px;color:var(--head);color-scheme:dark}
textarea.input{height:auto;padding:14px 16px;resize:vertical}
.input::placeholder{color:#A8927A}
.seg{display:grid;gap:6px}
.seg button{border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--line2);background:var(--card);color:var(--text);min-height:48px;padding:6px 2px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.dot{display:block;width:22px;height:22px;margin:0 auto 4px;border-radius:50%;border:2px solid currentColor}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.err{color:#F3A98C;font-size:13px;margin:0}
pre.msg{white-space:pre-wrap;font-family:inherit;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0 0;color:var(--head)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.btn.ghost{background:rgba(246,234,219,.1);color:var(--text);border:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media(min-width:900px){
  .bg-top{height:100vh;background:var(--bg);overflow:hidden}
  .bg-top::before{content:"";position:absolute;inset:0;background:var(--photo) center/cover;filter:blur(30px) brightness(.45);transform:scale(1.1)}
  .bg-top::after{background:linear-gradient(to right,var(--bg) 0%,rgba(18,10,5,.75) 48%,rgba(18,10,5,.6) 64%,rgba(18,10,5,0) 80%,rgba(18,10,5,0) 88%,rgba(18,10,5,.75) 97%),linear-gradient(to bottom,rgba(18,10,5,0) 70%,var(--bg) 100%),var(--photo) right 6% bottom/auto 100% no-repeat}
  .hero{justify-content:center;padding-top:0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast{transition:none}}
</style>
</head>

</div>

<div class="bar">

</div>

<dialog id="orderDlg" aria-labelledby="orderTitle">

function cupSVG(i){
  return i.cup
  ? `<svg width="52" height="66" viewBox="0 0 52 66" aria-hidden="true"><path d="M30 12L37 1" stroke="#E8B872" stroke-width="2.5" stroke-linecap="round"/><path d="M9 18H43L39.5 61a3 3 0 0 1-3 3H15.5a3 3 0 0 1-3-3Z" fill="${i.color}" stroke="#F6EADB" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 26H42L41.4 33H10.6Z" fill="${i.top}"/><rect x="6" y="12" width="40" height="7" rx="3.5" fill="#2A1A0F" stroke="#F6EADB" stroke-width="2.2"/></svg>`
  : `<svg width="66" height="56" viewBox="0 0 66 56" aria-hidden="true"><ellipse cx="33" cy="47" rx="29" ry="6" fill="#2A1A0F" stroke="#F6EADB" stroke-width="2.2"/><path d="M12 44V24a6 6 0 0 1 6-6H48a6 6 0 0 1 6 6V44Z" fill="${i.color}" stroke="#F6EADB" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 22Q33 12 52 22" fill="none" stroke="${i.top}" stroke-width="5" stroke-linecap="round"/><circle cx="33" cy="12" r="5" fill="${i.top}" stroke="#F6EADB" stroke-width="2.2"/></svg>`;
}
const plusSVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A0F07" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const minusSVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6EADB" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>';

function nameOf(i){ return state.lang === 'th' ? i.th : i.en; }

function renderI18n(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
  $('#fName').placeholder = state.lang === 'th' ? 'ชื่อของคุณ' : 'Your name';
  $('#fNotes').placeholder = state.lang === 'th' ? 'เช่น ไม่ใส่วิป' : 'Anything special?';
}
function renderCats(){
  $('#cats').innerHTML = CATS.map((c) =>
    `<button type="button" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${esc(state.lang === 'th' ? c.th + ' · ' + c.en : c.en + ' · ' + c.th)}</button>`).join('');
}
function renderGrid(){
  const list = MENU.filter((i) => state.cat === 'all' || i.cat === state.cat);
  $('#grid').innerHTML = list.map((i) => {
    const q = state.qty[i.id] || 0;
    const primary = state.lang === 'th' ? i.th : i.en, secondary = state.lang === 'th' ? i.en : i.th;
    const ctrl = q === 0
      ? `<button class="add" type="button" data-inc="${i.id}" aria-label="${esc(t('add') + ' ' + primary)}">${plusSVG}</button>`
      : `<div class="stepper"><button type="button" data-dec="${i.id}" aria-label="${esc(t('remove') + ' ' + primary)}">${minusSVG}</button><span>${q}</span><button class="plus" type="button" data-inc="${i.id}" aria-label="${esc(t('add') + ' ' + primary)}">${plusSVG.replace('20','18').replace('20','18')}</button></div>`;
    return `<article class="item"><div class="thumb">${cupSVG(i)}</div><div class="info"><h3>${esc(primary)}</h3><span class="th">${esc(secondary)}</span><span class="desc">${esc(state.lang === 'th' ? i.descTh : i.descEn)}</span><div class="row"><span class="price">${fmt(i.price)}</span>${ctrl}</div></div></article>`;
  }).join('');
}
function totals(){
  let count = 0, sum = 0, priced = true;
  for (const i of MENU){ const q = state.qty[i.id] || 0; if (!q) continue; count += q; if (i.price == null) priced = false; else sum += i.price * q; }
  return { count, sum, priced };
}
function renderBar(){
  const { count, sum, priced } = totals();
  $('#barCount').textContent = count === 0 ? t('addSome') : `${count} ${t('items')} · ${priced ? '฿' + sum : '฿ —'}`;
}
function renderSummary(){
  const rows = MENU.filter((i) => state.qty[i.id]).map((i) =>
    `<div class="line"><div><b>${state.qty[i.id]} × ${esc(nameOf(i))}</b><em>${esc(state.lang === 'th' ? i.en : i.th)}</em></div><span class="display">${i.price == null ? '฿ —' : '฿' + i.price * state.qty[i.id]}</span></div>`).join('');
  const { sum, priced } = totals();
  $('#summary').innerHTML = rows
    ? rows + `<div class="total"><span>${t('total')}</span><span>${priced ? '฿' + sum : '฿ —'}</span></div>`
    : `<p class="empty">${t('empty')}</p>`;
}
function seg(el, opts, key){
  el.innerHTML = opts.map((o) => `<button type="button" data-key="${key}" data-val="${o.v}" aria-pressed="${state[key] === o.v}">${o.html}</button>`).join('');
}
function renderSegs(){
  seg($('#segType'), [{ v:'pickup', html:t('pickup') }, { v:'delivery', html:t('delivery') }], 'type');
  seg($('#segSweet'), ['100','75','50','25','0'].map((p) => ({ v:p,
    html:`<span class="dot" style="background:${p === '0' ? 'transparent' : 'conic-gradient(currentColor ' + p + '%, transparent 0)'}"></span>${p}%` })), 'sweet');
  seg($('#segIce'), [{ v:'N', html:t('iceN') }, { v:'L', html:t('iceL') }, { v:'E', html:t('iceE') }, { v:'0', html:t('ice0') }], 'ice');
  $('#deliveryNote').hidden = state.type !== 'delivery';
}
function renderAll(){ renderI18n(); renderCats(); renderGrid(); renderBar(); renderSummary(); renderSegs(); }

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang){ state.lang = b.dataset.lang; try { localStorage.setItem('nw-lang', state.lang); } catch(err) {} renderAll(); }
  else if (b.dataset.cat){ state.cat = b.dataset.cat; renderCats(); renderGrid(); }
  else if (b.dataset.inc){ state.qty[b.dataset.inc] = (state.qty[b.dataset.inc] || 0) + 1; renderGrid(); renderBar(); renderSummary(); }
  else if (b.dataset.dec){ state.qty[b.dataset.dec] = Math.max(0, (state.qty[b.dataset.dec] || 0) - 1); renderGrid(); renderBar(); renderSummary(); }
  else if (b.dataset.key){ state[b.dataset.key] = b.dataset.val; renderSegs(); }
});

const dlg = $('#orderDlg');
$('#openOrder').addEventListener('click', () => { renderSummary(); $('#formView').hidden = false; $('#msgView').hidden = true; dlg.showModal(); });
$('#closeOrder').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
$('#backToForm').addEventListener('click', () => { $('#formView').hidden = false; $('#msgView').hidden = true; });

function buildMessage(){
  const L = state.lang === 'th';
  const sweetTxt = state.sweet + '%';
  const iceTxt = t({ N:'iceN', L:'iceL', E:'iceE', 0:'ice0' }[state.ice]);
  const lines = MENU.filter((i) => state.qty[i.id]).map((i) =>
    `• ${state.qty[i.id]} × ${i.th} / ${i.en}${i.price != null ? ' — ฿' + i.price * state.qty[i.id] : ''}`);
  const { sum, priced } = totals();
  const out = [
    'NUMWHAN SWEET CAFÉ — ' + (L ? 'ออเดอร์ใหม่' : 'New order'), '',
    ...lines,
    priced ? `${t('total')}: ฿${sum}` : '', '',
    `${t('name')}: ${$('#fName').value.trim()}`,
    $('#fContact').value.trim() ? `${t('contact')}: ${$('#fContact').value.trim()}` : '',
    `${t('orderType')}: ${t(state.type)}`,
    $('#fTime').value ? `${t('time')}: ${$('#fTime').value}` : '',
    `${t('sweetness')}: ${sweetTxt}`,
    `${t('ice')}: ${iceTxt}`,
    $('#fNotes').value.trim() ? `${t('notes')}: ${$('#fNotes').value.trim()}` : ''
  ];
  return out.filter((l, idx, arr) => l !== '' || (arr[idx - 1] !== '' && idx > 0)).join('\n').trim();
}
$('#orderForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const err = $('#formErr');
  if (!totals().count){ err.textContent = t('errEmpty'); return; }
  if (!$('#fName').value.trim()){ err.textContent = t('errName'); $('#fName').focus(); return; }
  err.textContent = '';
  const msg = buildMessage();
  $('#msgText').textContent = msg;
  const enc = encodeURIComponent(msg);
  $('#lineMsg').href = LINE_OA
    ? `https://line.me/R/oaMessage/${encodeURIComponent(LINE_OA)}/?${enc}`
    : `https://line.me/R/msg/text/?${enc}`;
  $('#formView').hidden = true; $('#msgView').hidden = false;
});
function toast(s){ const el = $('#toast'); el.textContent = s; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1600); }
$('#copyMsg').addEventListener('click', async () => {
  const text = $('#msgText').textContent;
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const r = document.createRange(); r.selectNodeContents($('#msgText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { document.execCommand('copy'); } catch(_){} }
  toast(t('copied'));
});

renderAll();
</script>
</body>
</html>
